<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compress — Finotrix Toolkit</title>
<link rel="stylesheet" href="../css/finotrix.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <div class="appbar"><div class="brand"><div class="logo">F</div><div><h1>Compress Image</h1><p class="sub">Reduce JPG / PNG / WebP size</p></div></div><nav><a class="home" href="../index.html">&larr; All tools</a></nav></div>
  <div class="grid2">
    <div class="card">
      <div class="card-title"><h3>Upload images</h3><span class="badge">JPG · PNG · WEBP</span></div>
      <div id="dropzone" class="dropzone" role="button" tabindex="0"><div class="upload-icon">&#8681;</div><strong>Click or drop images</strong><p>Batch supported.</p><div class="only">JPG · PNG · WEBP</div></div>
      <input id="fileInput" type="file" accept="image/*" multiple>
      <div id="fileList" class="file-list"></div>
      <div class="row">
        <div class="field"><label>Output format</label><select id="fmt"><option value="image/jpeg" selected>JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG (lossless)</option></select></div>
        <div class="field"><label>Quality: <span id="qv">80%</span></label><input id="q" type="range" min="30" max="98" value="80"></div>
        <div class="field"><label>Max width (px, 0 = keep)</label><input id="mw" type="number" value="0" min="0"></div>
      </div>
      <div class="actions"><button id="go" class="btn btn-primary" disabled>Compress</button><button id="clr" class="btn btn-secondary">Clear</button></div>
      <div id="status" class="status"></div><div id="progress" class="progress"><div></div></div>
      <div class="note">Multiple images download as .zip. 100% offline.</div>
    </div>
    <div class="card"><div class="card-title"><h3>Results</h3><span id="cnt" class="badge">—</span></div><div id="thumbs" class="thumbs"></div></div>
  </div>
  <footer class="footer"><div><strong>Finotrix Toolkit</strong> — Compress Image</div><div>100% offline.</div></footer>
</div>
<script src="../lib/jszip.min.js"></script>
<script src="../lib/common.js"></script>
<script>
(()=>{const {$,formatBytes,escapeHtml,stripExt,saveBlob}=FTX;let files=[];
$('q').oninput=()=>$('qv').textContent=$('q').value+'%';
FTX.wireDrop('dropzone','fileInput',list=>{for(const f of list)if(/^image\//.test(f.type))files.push(f);render();});
$('clr').onclick=()=>{files=[];render();$('thumbs').innerHTML='';$('cnt').textContent='—';FTX.hideStatus('status');FTX.hideProgress('progress');};
function render(){$('go').disabled=!files.length;const box=$('fileList');if(!files.length){box.className='file-list';box.innerHTML='';return;}box.className='file-list show';box.innerHTML=files.map((f,i)=>`<div class="file-row"><div class="file-kind">${(FTX.extOf(f.name)||'IMG').toUpperCase()}</div><div class="file-meta"><strong>${escapeHtml(f.name)}</strong><span>${formatBytes(f.size)}</span></div><button class="file-remove" data-i="${i}">✕</button></div>`).join('');box.querySelectorAll('.file-remove').forEach(b=>b.onclick=e=>{files.splice(+e.target.dataset.i,1);render();});}
async function process(f){
  const img=await FTX.loadImage(await FTX.readAsDataURL(f));
  const mw=+$('mw').value||0;let w=img.naturalWidth,h=img.naturalHeight;
  if(mw&&w>mw){h=Math.round(h*mw/w);w=mw;}
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
  const fmt=$('fmt').value;if(fmt==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);}
  ctx.drawImage(img,0,0,w,h);
  const q=(+$('q').value)/100;
  const blob=await new Promise(r=>cv.toBlob(r,fmt,fmt==='image/png'?undefined:q));
  const ext=fmt==='image/jpeg'?'jpg':fmt==='image/webp'?'webp':'png';
  return {name:stripExt(f.name)+'-min.'+ext,blob,orig:f.size};
}
$('go').onclick=async()=>{
  if(!files.length)return;$('go').disabled=true;$('thumbs').innerHTML='';FTX.progress('progress',3);const out=[];
  try{
    for(let i=0;i<files.length;i++){FTX.status('status',`Compressing ${i+1}/${files.length}…`,'info');const r=await process(files[i]);out.push(r);
      const t=document.createElement('div');t.className='thumb';const url=URL.createObjectURL(r.blob);const pct=Math.max(0,Math.round((1-r.blob.size/r.orig)*100));
      t.innerHTML=`<div class="tnum">-${pct}%</div>`;const im=new Image();im.src=url;t.appendChild(im);const dl=document.createElement('div');dl.className='tools';dl.innerHTML=`<button>${formatBytes(r.blob.size)}</button>`;dl.firstChild.onclick=()=>saveBlob(r.blob,r.name);t.appendChild(dl);$('thumbs').appendChild(t);
      FTX.progress('progress',Math.round((i+1)/files.length*88)+5);}
    $('cnt').textContent=out.length+' image(s)';
    if(out.length===1)saveBlob(out[0].blob,out[0].name);
    else{const zip=new JSZip();out.forEach(r=>zip.file(r.name,r.blob));saveBlob(await zip.generateAsync({type:'blob'}),'finotrix-compressed.zip');}
    FTX.status('status','Done.','good');FTX.progress('progress',100);setTimeout(()=>FTX.hideProgress('progress'),700);
  }catch(e){console.error(e);FTX.status('status',e.message||'Failed.','bad');FTX.hideProgress('progress');}
  $('go').disabled=false;
};
})();
</script>
</body>
</html>
