<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to PDF — Finotrix Toolkit</title>
<link rel="stylesheet" href="../css/finotrix.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <div class="appbar"><div class="brand"><div class="logo">F</div><div><h1>Scan to PDF</h1><p class="sub">Capture pages with your camera</p></div></div><nav><a class="home" href="../index.html">&larr; All tools</a></nav></div>
  <div class="grid2">
    <div class="card">
      <div class="card-title"><h3>Camera</h3><span id="camState" class="badge">off</span></div>
      <video id="video" playsinline style="width:100%;border:1px solid var(--line);border-radius:10px;background:#000;display:none"></video>
      <div id="camHint" class="note">Use your webcam/phone camera to snap document pages, or add image files below.</div>
      <div class="actions">
        <button id="start" class="btn btn-primary">Start camera</button>
        <button id="snap" class="btn btn-gold" disabled>Capture</button>
        <button id="stop" class="btn btn-secondary" disabled>Stop</button>
      </div>
      <div class="field"><label>Or add image files</label><input id="fileInput" type="file" accept="image/*" multiple style="display:block"></div>
      <label class="opt"><input id="gray" type="checkbox"><span>Grayscale &amp; boost contrast (document look)</span></label>
    </div>
    <div class="card">
      <div class="card-title"><h3>Pages</h3><span id="cnt" class="badge">0</span></div>
      <div id="thumbs" class="thumbs"></div>
      <div class="row">
        <div class="field"><label>Page size</label><select id="size"><option value="fit" selected>Fit to image</option><option value="a4p">A4 portrait</option><option value="a4l">A4 landscape</option></select></div>
      </div>
      <div class="actions"><button id="go" class="btn btn-primary" disabled>Create PDF</button><button id="clr" class="btn btn-secondary">Clear</button></div>
      <div id="status" class="status"></div><div id="progress" class="progress"><div></div></div>
    </div>
  </div>
  <footer class="footer"><div><strong>Finotrix Toolkit</strong> — Scan to PDF</div><div>100% offline &mdash; images never leave your device.</div></footer>
</div>
<script src="../lib/pdf-lib.min.js"></script>
<script src="../lib/common.js"></script>
<script>
(()=>{const {$,saveBytes}=FTX;let stream=null;let shots=[]; // [{blob}]
$('start').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('video');v.srcObject=stream;v.style.display='block';await v.play();
    $('camState').textContent='live';$('snap').disabled=false;$('stop').disabled=false;$('start').disabled=true;$('camHint').style.display='none';
  }catch(e){FTX.status('status','Camera unavailable: '+(e.message||e)+'. You can still add image files.','bad');}
};
$('stop').onclick=stopCam;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('video').style.display='none';$('camState').textContent='off';$('snap').disabled=true;$('stop').disabled=true;$('start').disabled=false;}
$('snap').onclick=async()=>{
  const v=$('video');if(!v.videoWidth)return;
  const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;
  cv.getContext('2d').drawImage(v,0,0);
  const blob=await processCanvas(cv);shots.push({blob});render();
};
$('fileInput').onchange=async e=>{
  for(const f of Array.from(e.target.files||[])){if(!/^image\//.test(f.type))continue;const img=await FTX.loadImage(await FTX.readAsDataURL(f));const cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;cv.getContext('2d').drawImage(img,0,0);shots.push({blob:await processCanvas(cv)});}
  e.target.value='';render();
};
async function processCanvas(cv){
  if($('gray').checked){const ctx=cv.getContext('2d');const d=ctx.getImageData(0,0,cv.width,cv.height);const a=d.data;for(let i=0;i<a.length;i+=4){let g=0.3*a[i]+0.59*a[i+1]+0.11*a[i+2];g=(g-128)*1.35+128+10;g=Math.max(0,Math.min(255,g));a[i]=a[i+1]=a[i+2]=g;}ctx.putImageData(d,0,0);}
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
}
$('clr').onclick=()=>{shots=[];render();FTX.hideStatus('status');FTX.hideProgress('progress');};
function render(){
  $('cnt').textContent=shots.length;$('go').disabled=!shots.length;const box=$('thumbs');box.innerHTML='';
  shots.forEach((s,i)=>{const t=document.createElement('div');t.className='thumb';t.innerHTML=`<div class="tnum">${i+1}</div>`;const im=new Image();im.src=URL.createObjectURL(s.blob);t.appendChild(im);const tools=document.createElement('div');tools.className='tools';tools.innerHTML='<button>Remove</button>';tools.firstChild.onclick=()=>{shots.splice(i,1);render();};t.appendChild(tools);box.appendChild(t);});
}
$('go').onclick=async()=>{
  if(!shots.length)return;$('go').disabled=true;FTX.progress('progress',5);
  try{
    const {PDFDocument}=PDFLib;const doc=await PDFDocument.create();const size=$('size').value;const A4=[595.28,841.89];
    for(let i=0;i<shots.length;i++){
      FTX.status('status',`Adding page ${i+1}/${shots.length}…`,'info');
      const bytes=new Uint8Array(await shots[i].blob.arrayBuffer());const img=await doc.embedJpg(bytes);
      let pw,ph;if(size==='fit'){pw=img.width;ph=img.height;}else{[pw,ph]=size==='a4l'?[A4[1],A4[0]]:A4;}
      const page=doc.addPage([pw,ph]);const s=Math.min(pw/img.width,ph/img.height);const w=img.width*s,h=img.height*s;
      page.drawImage(img,{x:(pw-w)/2,y:(ph-h)/2,width:w,height:h});
      FTX.progress('progress',5+Math.round((i+1)/shots.length*90));
    }
    saveBytes(await doc.save(),'finotrix-scan.pdf','application/pdf');
    FTX.status('status',`PDF created with ${shots.length} page(s).`,'good');FTX.progress('progress',100);setTimeout(()=>FTX.hideProgress('progress'),800);
  }catch(e){console.error(e);FTX.status('status',e.message||'Failed.','bad');FTX.hideProgress('progress');}
  $('go').disabled=false;
};
window.addEventListener('beforeunload',stopCam);
})();
</script>
</body>
</html>
