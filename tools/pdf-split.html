<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Split — Finotrix Toolkit</title>
<link rel="stylesheet" href="../css/finotrix.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <div class="appbar"><div class="brand"><div class="logo">F</div><div><h1>Split PDF</h1><p class="sub">Extract page ranges or burst to single pages</p></div></div><nav><a class="home" href="../index.html">&larr; All tools</a></nav></div>
  <div class="card" style="max-width:680px">
    <div class="card-title"><h3>Upload PDF</h3><span id="pc" class="badge">—</span></div>
    <div id="dropzone" class="dropzone" role="button" tabindex="0"><div class="upload-icon">&#8681;</div><strong>Click or drop a PDF</strong><p>Then choose what to extract.</p><div class="only">PDF</div></div>
    <input id="fileInput" type="file" accept=".pdf">
    <div id="fileList" class="file-list"></div>
    <div class="options">
      <label class="opt"><input type="radio" name="mode" value="ranges" checked><span><strong>Extract page range(s)</strong> into one PDF</span></label>
      <div class="field" style="margin-left:26px"><input id="ranges" type="text" placeholder="e.g. 1-3, 5, 8-10"></div>
      <label class="opt"><input type="radio" name="mode" value="burst"><span><strong>Burst</strong> — every page as a separate PDF (.zip)</span></label>
    </div>
    <div class="actions"><button id="go" class="btn btn-primary" disabled>Split</button><button id="clr" class="btn btn-secondary">Clear</button></div>
    <div id="status" class="status"></div><div id="progress" class="progress"><div></div></div>
    <div id="libraryState" class="library-state">Loading…</div>
    <div class="note">100% offline.</div>
  </div>
  <footer class="footer"><div><strong>Finotrix Toolkit</strong> — Split PDF</div><div>100% offline.</div></footer>
</div>
<script src="../lib/pdf-lib.min.js"></script>
<script src="../lib/jszip.min.js"></script>
<script src="../lib/common.js"></script>
<script>
(()=>{const {$,formatBytes,escapeHtml,stripExt,saveBytes,saveBlob}=FTX;let file=null,numPages=0;
$('libraryState').innerHTML=`<span class="${window.PDFLib?'ok':'bad'}">${window.PDFLib?'✓':'✕'} PDF engine</span> &nbsp; <span class="${window.JSZip?'ok':'bad'}">${window.JSZip?'✓':'✕'} ZIP</span>`;
FTX.wireDrop('dropzone','fileInput',async list=>{const f=list[0];if(!f||FTX.extOf(f.name)!=='pdf'){FTX.status('status','Please choose a PDF.','bad');return;}file=f;const doc=await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()),{ignoreEncryption:true});numPages=doc.getPageCount();$('pc').textContent=numPages+' pages';$('fileList').className='file-list show';$('fileList').innerHTML=`<div class="file-row"><div class="file-kind">PDF</div><div class="file-meta"><strong>${escapeHtml(f.name)}</strong><span>${formatBytes(f.size)} · ${numPages} pages</span></div></div>`;$('go').disabled=false;$('ranges').value=`1-${numPages}`;FTX.hideStatus('status');});
$('clr').onclick=()=>{file=null;numPages=0;$('fileList').className='file-list';$('fileList').innerHTML='';$('go').disabled=true;$('pc').textContent='—';FTX.hideStatus('status');FTX.hideProgress('progress');};
function parseRanges(s,max){const out=[];for(const part of String(s).split(',')){const t=part.trim();if(!t)continue;const m=t.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)if(i>=1&&i<=max)out.push(i-1);}else if(/^\d+$/.test(t)){const n=+t;if(n>=1&&n<=max)out.push(n-1);}}return out;}
$('go').onclick=async()=>{
  if(!file)return;$('go').disabled=true;FTX.progress('progress',5);
  try{
    const {PDFDocument}=PDFLib;const src=await PDFDocument.load(new Uint8Array(await file.arrayBuffer()),{ignoreEncryption:true});
    const mode=document.querySelector('input[name=mode]:checked').value;
    if(mode==='ranges'){
      const idx=parseRanges($('ranges').value,numPages);
      if(!idx.length){FTX.status('status','No valid pages in that range.','bad');$('go').disabled=false;return;}
      const out=await PDFDocument.create();const cp=await out.copyPages(src,idx);cp.forEach(p=>out.addPage(p));
      const bytes=await out.save();saveBytes(bytes,stripExt(file.name)+`-pages.pdf`,'application/pdf');
      FTX.status('status',`Extracted ${idx.length} page(s).`,'good');
    }else{
      const zip=new JSZip();
      for(let i=0;i<numPages;i++){FTX.status('status',`Page ${i+1}/${numPages}…`,'info');const out=await PDFDocument.create();const[p]=await out.copyPages(src,[i]);out.addPage(p);const b=await out.save();zip.file(`${stripExt(file.name)}-p${String(i+1).padStart(2,'0')}.pdf`,b);FTX.progress('progress',Math.round((i+1)/numPages*88)+5);}
      const zb=await zip.generateAsync({type:'blob'});saveBlob(zb,stripExt(file.name)+'-pages.zip');
      FTX.status('status',`Burst into ${numPages} files (.zip).`,'good');
    }
    FTX.progress('progress',100);setTimeout(()=>FTX.hideProgress('progress'),700);
  }catch(e){console.error(e);FTX.status('status',e.message||'Failed.','bad');FTX.hideProgress('progress');}
  $('go').disabled=false;
};
})();
</script>
</body>
</html>
