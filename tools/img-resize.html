<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resize — Finotrix Toolkit</title>
<link rel="stylesheet" href="../css/finotrix.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <div class="appbar"><div class="brand"><div class="logo">F</div><div><h1>Resize Image</h1><p class="sub">Change pixel dimensions</p></div></div><nav><a class="home" href="../index.html">&larr; All tools</a></nav></div>
  <div class="grid2">
    <div class="card">
      <div class="card-title"><h3>Upload images</h3><span class="badge">Any image</span></div>
      <div id="dropzone" class="dropzone" role="button" tabindex="0"><div class="upload-icon">&#8681;</div><strong>Click or drop images</strong><p>Batch supported.</p><div class="only">JPG · PNG · WEBP</div></div>
      <input id="fileInput" type="file" accept="image/*" multiple>
      <div id="fileList" class="file-list"></div>
      <div class="options">
        <label class="opt"><input type="radio" name="mode" value="dim" checked><span><strong>By dimensions</strong></span></label>
        <div class="row" style="margin-left:26px">
          <div class="field"><label>Width (px)</label><input id="w" type="number" min="1" placeholder="auto"></div>
          <div class="field"><label>Height (px)</label><input id="h" type="number" min="1" placeholder="auto"></div>
        </div>
        <label class="opt" style="margin-left:26px"><input id="keep" type="checkbox" checked><span>Keep aspect ratio</span></label>
        <label class="opt"><input type="radio" name="mode" value="pct"><span><strong>By percentage</strong></span></label>
        <div class="field" style="margin-left:26px"><label>Scale: <span id="pv">50%</span></label><input id="pct" type="range" min="5" max="200" value="50"></div>
      </div>
      <div class="row"><div class="field"><label>Output format</label><select id="fmt"><option value="keep" selected>Keep original</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div></div>
      <div class="actions"><button id="go" class="btn btn-primary" disabled>Resize</button><button id="clr" class="btn btn-secondary">Clear</button></div>
      <div id="status" class="status"></div><div id="progress" class="progress"><div></div></div>
      <div class="note">Multiple images download as .zip. 100% offline.</div>
    </div>
    <div class="card"><div class="card-title"><h3>Results</h3><span id="cnt" class="badge">—</span></div><div id="thumbs" class="thumbs"></div></div>
  </div>
  <footer class="footer"><div><strong>Finotrix Toolkit</strong> — Resize Image</div><div>100% offline.</div></footer>
</div>
<script src="../lib/jszip.min.js"></script>
<script src="../lib/common.js"></script>
<script>
(()=>{const {$,formatBytes,escapeHtml,stripExt,extOf,saveBlob}=FTX;let files=[];
$('pct').oninput=()=>$('pv').textContent=$('pct').value+'%';
FTX.wireDrop('dropzone','fileInput',list=>{for(const f of list)if(/^image\//.test(f.type))files.push(f);render();});
$('clr').onclick=()=>{files=[];render();$('thumbs').innerHTML='';$('cnt').textContent='—';FTX.hideStatus('status');FTX.hideProgress('progress');};
function render(){$('go').disabled=!files.length;const box=$('fileList');if(!files.length){box.className='file-list';box.innerHTML='';return;}box.className='file-list show';box.innerHTML=files.map((f,i)=>`<div class="file-row"><div class="file-kind">${(extOf(f.name)||'IMG').toUpperCase()}</div><div class="file-meta"><strong>${escapeHtml(f.name)}</strong><span>${formatBytes(f.size)}</span></div><button class="file-remove" data-i="${i}">✕</button></div>`).join('');box.querySelectorAll('.file-remove').forEach(b=>b.onclick=e=>{files.splice(+e.target.dataset.i,1);render();});}
function targetDims(iw,ih){
  const mode=document.querySelector('input[name=mode]:checked').value;
  if(mode==='pct'){const s=(+$('pct').value)/100;return[Math.max(1,Math.round(iw*s)),Math.max(1,Math.round(ih*s))];}
  let w=+$('w').value||0,h=+$('h').value||0;const keep=$('keep').checked;
  if(keep){if(w&&!h)h=Math.round(ih*w/iw);else if(h&&!w)w=Math.round(iw*h/ih);else if(w&&h){const s=Math.min(w/iw,h/ih);w=Math.round(iw*s);h=Math.round(ih*s);}else{w=iw;h=ih;}}
  else{w=w||iw;h=h||ih;}
  return[Math.max(1,w),Math.max(1,h)];
}
async function process(f){
  const img=await FTX.loadImage(await FTX.readAsDataURL(f));
  const[w,h]=targetDims(img.naturalWidth,img.naturalHeight);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
  let fmt=$('fmt').value;if(fmt==='keep')fmt=f.type&&/^image\/(jpeg|png|webp)$/.test(f.type)?f.type:'image/png';
  if(fmt==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);}
  ctx.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,fmt,fmt==='image/png'?undefined:0.92));
  const ext=fmt==='image/jpeg'?'jpg':fmt==='image/webp'?'webp':'png';
  return {name:`${stripExt(f.name)}-${w}x${h}.${ext}`,blob,w,h};
}
$('go').onclick=async()=>{
  if(!files.length)return;$('go').disabled=true;$('thumbs').innerHTML='';FTX.progress('progress',3);const out=[];
  try{
    for(let i=0;i<files.length;i++){FTX.status('status',`Resizing ${i+1}/${files.length}…`,'info');const r=await process(files[i]);out.push(r);
      const t=document.createElement('div');t.className='thumb';t.innerHTML=`<div class="tnum">${r.w}×${r.h}</div>`;const im=new Image();im.src=URL.createObjectURL(r.blob);t.appendChild(im);const dl=document.createElement('div');dl.className='tools';dl.innerHTML=`<button>${formatBytes(r.blob.size)}</button>`;dl.firstChild.onclick=()=>saveBlob(r.blob,r.name);t.appendChild(dl);$('thumbs').appendChild(t);
      FTX.progress('progress',Math.round((i+1)/files.length*88)+5);}
    $('cnt').textContent=out.length+' image(s)';
    if(out.length===1)saveBlob(out[0].blob,out[0].name);else{const zip=new JSZip();out.forEach(r=>zip.file(r.name,r.blob));saveBlob(await zip.generateAsync({type:'blob'}),'finotrix-resized.zip');}
    FTX.status('status','Done.','good');FTX.progress('progress',100);setTimeout(()=>FTX.hideProgress('progress'),700);
  }catch(e){console.error(e);FTX.status('status',e.message||'Failed.','bad');FTX.hideProgress('progress');}
  $('go').disabled=false;
};
})();
</script>
</body>
</html>
